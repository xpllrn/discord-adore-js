<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adore - Discord Bot</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 1.5rem;
      opacity: 0.8;
      margin-bottom: 2rem;
    }

    .status {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #1DB954;
      color: #fff;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🤖 adore</h1>
    <p>Discord bot with Spotify integration</p>
    <div class="status">✅ Online</div>
  </div>
</body>

</html>
